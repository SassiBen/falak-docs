[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "falak-docs"
version = "0.2.0"
description = "Questions-réponses sur les documents d'une entreprise (RAG), avec un LLM local ou l'API Claude"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sassi Benalouache" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.75",
    "chromadb>=0.5",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pypdf>=4.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
falak-docs = "falakdocs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/falakdocs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
